[package]
name = "polaris-log-budget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
# OpenOptionsExt 只暴露 raw custom_flags；用平台 libc 的 O_NOFOLLOW，避免 root helper
# 在用户可写日志目录跟随末段 symlink。
libc = "0.2"
