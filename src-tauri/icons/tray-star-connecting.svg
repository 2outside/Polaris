<!--
  Polaris 托盘标记 — CONNECTING（起核中）。单色（黑）+ 透明底：alpha 即形状。
  几何 = filled 版的星形路径，但**整圈轨道环与两颗轨道点全部去掉**——刻意换的是**轮廓**而非粗细：
  idle(空心星+细环) / connected(实心星+厚环) 两态的差别本就靠「星填充 + 环粗细」表达，起核态若再
  在同一维度上取中间值（实心星+细环），16px 下与 connected 几乎不可分。去掉环 = 换掉外轮廓，
  「有没有那个圈」是 16px 也能一眼判的二值特征。
  改此文件后重生 tray-connecting-black/white.png（rsvg-convert 176 → 缩 44 + PIL 派生白）。
-->
